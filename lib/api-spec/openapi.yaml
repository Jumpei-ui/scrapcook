openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scrapcook
    description: ScrapCook cooking session and recipe operations
  - name: savings
    description: ScrapCook savings records and dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /scrapcook/session:
    get:
      operationId: getScrapCookSession
      tags: [scrapcook]
      summary: Get the current cooking session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapCookSession"
    put:
      operationId: updateScrapCookSession
      tags: [scrapcook]
      summary: Save fridge ingredients and cooking preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapCookSessionInput"
      responses:
        "200":
          description: Updated cooking session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapCookSession"
  /recipes:
    post:
      operationId: generateScrapCookRecipes
      tags: [scrapcook]
      summary: Find up to 50 recipes using ingredients and cooking preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeGenerationInput"
      responses:
        "200":
          description: Matching Spoonacular recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResults"
        "400":
          description: Session needs ingredients and preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Recipe provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: More than 20 recipe requests from this IP in the past hour
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Recipe service unavailable or server secrets not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /getRecipes:
    post:
      operationId: generateScrapCookRecipesAlias
      tags: [scrapcook]
      summary: Compatibility alias for recipe generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeGenerationInput"
      responses:
        "200":
          description: Recipe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResults"
        "400":
          description: Invalid recipe request
        "429":
          description: Recipe usage limit reached
        "502":
          description: Provider failure
        "503":
          description: Service unavailable
  /admin/login:
    post:
      operationId: loginPrivateRecipeAdmin
      tags: [admin]
      summary: Exchange the owner password for an HttpOnly admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateAdminLoginInput"
      responses:
        "204":
          description: Signed HttpOnly admin cookie issued
        "404":
          description: Not found
  /admin/usage:
    get:
      operationId: getPrivateRecipeUsage
      tags: [admin]
      summary: Owner-only daily usage and recent request history
      parameters:
        - in: cookie
          name: scrapcook_admin
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brisbane-local daily usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateRecipeUsage"
        "404":
          description: Not found
        "503":
          description: Usage storage unavailable
  /admin/reset:
    post:
      operationId: resetPrivateRecipeUsage
      tags: [admin]
      summary: Owner-only reset of display counters, not provider quotas or protective limits
      parameters:
        - in: cookie
          name: scrapcook_admin
          required: true
          schema:
            type: string
        - in: header
          name: X-Admin-CSRF
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateRecipeUsage"
        "404":
          description: Not found
        "503":
          description: Usage storage unavailable
  /internal/provider-usage:
    post:
      operationId: recordInternalProviderUsage
      tags: [internal]
      summary: Authenticated server-to-server provider-call tracking
      parameters:
        - in: header
          name: X-Internal-Usage
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalProviderUsageInput"
      responses:
        "204":
          description: Provider call recorded
        "400":
          description: Invalid provider
        "404":
          description: Not found
        "503":
          description: Usage storage unavailable
  /scrapcook/recipes/{recipeId}:
    get:
      operationId: getScrapCookRecipe
      tags: [scrapcook]
      summary: Get ingredients and instructions for a recipe
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full recipe details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "404":
          description: Recipe is not in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scrapcook/recipes/{recipeId}/made:
    post:
      operationId: markScrapCookRecipeMade
      tags: [scrapcook]
      summary: Mark a recipe as made in the current session
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recipe marked as made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MadeRecipe"
        "404":
          description: Recipe is not in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scrapcook/savings/dashboard:
    get:
      operationId: getScrapCookSavingsDashboard
      tags: [savings]
      summary: Get the current user's savings dashboard
      responses:
        "200":
          description: Savings totals, daily chart data, recent meals, and comparison preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsDashboard"
        "500":
          description: Could not load savings data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scrapcook/savings/estimate:
    post:
      operationId: estimateScrapCookRecipeCost
      tags: [savings]
      summary: Estimate the ingredient cost per serving for a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCostEstimateInput"
      responses:
        "200":
          description: Editable rough Australian grocery cost estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeCostEstimate"
        "400":
          description: Recipe identifier is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Recipe is not in the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Recipe details could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scrapcook/savings/meals:
    post:
      operationId: createScrapCookMeal
      tags: [savings]
      summary: Save a cooked meal and its calculated savings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookedMealInput"
      responses:
        "201":
          description: Cooked meal saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookedMeal"
        "400":
          description: Meal details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Meal could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scrapcook/savings/settings:
    put:
      operationId: updateScrapCookSavingsSettings
      tags: [savings]
      summary: Save the default meal comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsSettingsInput"
      responses:
        "200":
          description: Updated comparison preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsComparison"
        "400":
          description: Settings are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Settings could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    PrivateAdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
    InternalProviderUsageInput:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [spoon, gemini]
    PrivateRecipeUsage:
      type: object
      required: [date, spoon, gemini, totalRequests, recentRequests, limits]
      properties:
        date:
          type: string
        spoon:
          type: integer
        gemini:
          type: integer
        totalRequests:
          type: integer
        recentRequests:
          type: array
          maxItems: 20
          items:
            type: object
            required: [ip, timestamp]
            properties:
              ip:
                type: string
              timestamp:
                type: string
                format: date-time
        limits:
          type: object
          required: [spoon, gemini]
          properties:
            spoon:
              type: integer
            gemini:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CookingExperience:
      type: string
      enum: [beginner, intermediate, pro]
    CookingTime:
      type: string
      enum: [under15, 15to30, 30to60, noLimit]
    Equipment:
      type: string
      enum: [stove, oven, microwave, airFryer, coldMeals]
    MaxReadyTime:
      type: integer
      enum: [0, 15, 30, 45, 60, 90, 120, 180]
      description: Maximum recipe time in minutes; zero means no limit
    DietPreference:
      type: string
      enum: [none, vegetarian, vegan, pescetarian, glutenFree, ketogenic, paleo]
    CookingPreferences:
      type: object
      properties:
        experience:
          $ref: "#/components/schemas/CookingExperience"
        timeAvailable:
          $ref: "#/components/schemas/CookingTime"
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/Equipment"
          minItems: 1
        maxReadyTime:
          $ref: "#/components/schemas/MaxReadyTime"
        diet:
          $ref: "#/components/schemas/DietPreference"
      required: [experience, timeAvailable, equipment, maxReadyTime, diet]
    ScrapCookSessionInput:
      type: object
      properties:
        ingredients:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 3
          maxItems: 40
        preferences:
          oneOf:
            - $ref: "#/components/schemas/CookingPreferences"
            - type: "null"
      required: [ingredients, preferences]
    RecipeGenerationInput:
      type: object
      properties:
        ingredients:
          type: array
          minItems: 3
          maxItems: 40
          items:
            type: string
            maxLength: 60
        preferences:
          $ref: "#/components/schemas/CookingPreferences"
        snackMode:
          type: boolean
          default: false
        showNutrition:
          type: boolean
          default: true
      required: [ingredients]
    RecipeSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        image:
          type: string
          format: uri
        readyInMinutes:
          type: integer
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Pro]
        missingIngredients:
          type: integer
        servings:
          type: integer
        made:
          type: boolean
        nutrition:
          type: [object, "null"]
          properties:
            calories:
              type: number
            protein:
              type: number
            carbs:
              type: number
            fat:
              type: number
            fiber:
              type: number
          required: [calories, protein, carbs, fat, fiber]
      required: [id, title, image, readyInMinutes, difficulty, missingIngredients, servings, made]
    RecipeIngredient:
      type: object
      properties:
        name:
          type: string
        original:
          type: string
        amount:
          type: number
        unit:
          type: string
        inFridge:
          type: boolean
      required: [name, original, amount, unit, inFridge]
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/RecipeIngredient"
            instructions:
              type: array
              items:
                type: string
            instructionsSimplified:
              type: boolean
            instructionsNote:
              type: ["string", "null"]
          required: [ingredients, instructions, instructionsSimplified, instructionsNote]
    ScrapCookSession:
      type: object
      properties:
        ingredients:
          type: array
          items:
            type: string
        preferences:
          oneOf:
            - $ref: "#/components/schemas/CookingPreferences"
            - type: "null"
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
        demoMode:
          type: boolean
      required: [ingredients, preferences, recipes, demoMode]
    RecipeResults:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
          minItems: 0
          maxItems: 50
        demoMode:
          type: boolean
      required: [recipes, demoMode]
    MadeRecipe:
      type: object
      properties:
        recipeId:
          type: string
        made:
          type: boolean
      required: [recipeId, made]
    SavingsComparison:
      type: object
      properties:
        label:
          type: string
          enum: [Takeaway, Uber Eats, HelloFresh, Woolies new shop]
        cost:
          type: number
          minimum: 0
      required: [label, cost]
    SavingsSettingsInput:
      type: object
      properties:
        label:
          type: string
          enum: [Takeaway, Uber Eats, HelloFresh, Woolies new shop]
        cost:
          type: number
          minimum: 0
      required: [label, cost]
    CookedMealInput:
      type: object
      properties:
        recipeName:
          type: string
          minLength: 1
          maxLength: 200
        actualCost:
          type: number
          minimum: 0
        comparedToLabel:
          type: string
          enum: [Takeaway, Uber Eats, HelloFresh, Woolies new shop]
        comparedToCost:
          type: number
          minimum: 0
      required: [recipeName, actualCost, comparedToLabel, comparedToCost]
    CookedMeal:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        recipeName:
          type: string
        actualCost:
          type: number
        comparedToLabel:
          type: string
        comparedToCost:
          type: number
        amountSaved:
          type: number
      required:
        [id, createdAt, recipeName, actualCost, comparedToLabel, comparedToCost, amountSaved]
    SavingsDailyTotal:
      type: object
      properties:
        date:
          type: string
          format: date
        amountSaved:
          type: number
      required: [date, amountSaved]
    SavingsDashboard:
      type: object
      properties:
        todaySavings:
          type: number
        weekSavings:
          type: number
        monthSavings:
          type: number
        yearSavings:
          type: number
        dailySavings:
          type: array
          items:
            $ref: "#/components/schemas/SavingsDailyTotal"
          minItems: 7
          maxItems: 7
        recentMeals:
          type: array
          items:
            $ref: "#/components/schemas/CookedMeal"
        defaultComparison:
          $ref: "#/components/schemas/SavingsComparison"
      required:
        [todaySavings, weekSavings, monthSavings, yearSavings, dailySavings, recentMeals, defaultComparison]
    RecipeCostEstimateInput:
      type: object
      properties:
        recipeId:
          type: string
          minLength: 1
          maxLength: 100
      required: [recipeId]
    RecipeCostEstimate:
      type: object
      properties:
        estimatedCostPerServe:
          type: number
          minimum: 0
        estimateType:
          type: string
          enum: [reference]
        note:
          type: string
      required: [estimatedCostPerServe, estimateType, note]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

